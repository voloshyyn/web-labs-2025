<div class="watchlist-hero" role="banner" aria-label="Watchlist header">
  <div class="container watchlist-hero__container">
    <div class="watchlist-hero__inner">
      <h1 class="watchlist-hero__title" data-i18n="watchlist.title">
        My Watchlist
      </h1>

      <div class="watchlist-hero__actions">
        <button
          class="btn btn--primary watchlist-hero__add"
          type="button"
          aria-label="Add new asset"
          data-i18n="watchlist.add"
        >
          + New Asset
        </button>
      </div>
    </div>
  </div>
</div>
