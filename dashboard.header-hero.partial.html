<div class="dashboard-hero">
  <div class="container dashboard-hero__container">
    <h1 class="dashboard-hero__title" data-i18n="dashboard.title">Dashboard</h1>
    <div class="dashboard-hero__main">
      <div class="dashboard-hero__stats">
        <div class="dashboard-hero__label">
          <p
            class="dashboard-hero__label-text"
            data-i18n="dashboard.total_worth_label"
          >
            Total Worth
          </p>
          <img
            class="dashboard-hero__label-icon"
            src="img/icon-description_more-about.png"
            alt="Description dots"
          />
        </div>
        <div class="dashboard-hero__amount">
          <p class="dashboard-hero__amount-text">$6,525,977,658.81</p>
        </div>

        <div class="dashboard-hero__delta-row">
          <div class="dashboard-hero__delta">
            <span class="dashboard-hero__delta-amount">-$73,940,262.61</span>
            <div class="dashboard-hero__badge">
              <img
                class="dashboard-hero__badge-arrow"
                src="img/arrow_price-drop-down.svg"
                alt="Price drop down arrow"
              />
              <span class="dashboard-hero__badge-negative">1.12%</span>
            </div>
          </div>
        </div>
      </div>
      <button
        type="button"
        class="dashboard-hero__btn"
        aria-label="Sync dashboard"
        data-i18n="dashboard.sync"
      >
        Sync
      </button>
    </div>
  </div>
</div>
