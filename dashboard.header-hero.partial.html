<header class="dashboard-hero" role="region" aria-label="Dashboard header">
  <div class="dashboard-hero__inner">
    <div class="dashboard-hero__main">
      <h1 class="dashboard-hero__title">Dashboard</h1>

      <div class="dashboard-hero__stats" aria-hidden="false">
        <div class="dashboard-hero__label">Total Worth</div>
        <div class="dashboard-hero__amount" aria-live="polite">
          $6,525,977,658.81
        </div>

        <div class="dashboard-hero__delta-row">
          <div class="dashboard-hero__delta">
            <span class="dashboard-hero__delta-amount">-$73,940,262.61</span>
            <span class="dashboard-hero__badge dashboard-hero__badge--negative"
              >-1.12%</span
            >
          </div>
        </div>
      </div>
    </div>

    <div class="dashboard-hero__actions">
      <button
        type="button"
        class="dashboard-hero__btn"
        aria-label="Sync dashboard"
      >
        Sync
      </button>
    </div>
  </div>
</header>
