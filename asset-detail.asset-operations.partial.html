<div class="asset-operations" aria-label="Asset operations">
  <aside class="asset-operations__converters" aria-label="Converters">
    <div class="converter converter--card">
      <h3 class="converter__title">BTC to USD Converter</h3>
      <label class="converter__field">
        <span class="u-visually-hidden">BTC amount</span>
        <input
          class="input input--muted"
          type="text"
          name="btc-usd"
          placeholder="BTC"
        />
      </label>

      <label class="converter__field">
        <span class="u-visually-hidden">USD amount</span>
        <input
          class="input input--muted"
          type="text"
          name="usd"
          placeholder="USD"
        />
      </label>
    </div>

    <div class="converter converter--card">
      <h3 class="converter__title">BTC to EUR Converter</h3>
      <label class="converter__field">
        <span class="u-visually-hidden">BTC amount</span>
        <input
          class="input input--muted"
          type="text"
          name="btc-eur"
          placeholder="BTC"
        />
      </label>

      <label class="converter__field">
        <span class="u-visually-hidden">EUR amount</span>
        <input
          class="input input--muted"
          type="text"
          name="eur"
          placeholder="EUR"
        />
      </label>
    </div>
  </aside>

  <div class="markets-card" aria-label="Markets">
    <div class="markets-card__head">
      <h2 class="markets-card__title">Markets</h2>
    </div>

    <div class="markets-card__body">
      <table class="markets-card__table" summary="Market prices from exchanges">
        <thead>
          <tr>
            <th>#</th>
            <th>Exchange</th>
            <th>Pair</th>
            <th>Price</th>
            <th>Confidence</th>
            <th>Updated</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>1</td>
            <td class="markets-card__exchange">Binance</td>
            <td>BTC/USDT</td>
            <td>$109,877.36</td>
            <td><span class="badge badge--high">High</span></td>
            <td>4 hours ago</td>
          </tr>

          <tr>
            <td>2</td>
            <td class="markets-card__exchange">Coinbase</td>
            <td>BTC/USD</td>
            <td>$109,900.12</td>
            <td><span class="badge badge--high">High</span></td>
            <td>3 hours ago</td>
          </tr>

          <tr>
            <td>3</td>
            <td class="markets-card__exchange">Kraken</td>
            <td>BTC/EUR</td>
            <td>$109,650.88</td>
            <td><span class="badge badge--medium">Medium</span></td>
            <td>2 hours ago</td>
          </tr>

          <tr>
            <td>4</td>
            <td class="markets-card__exchange">Bitstamp</td>
            <td>BTC/USD</td>
            <td>$109,999.00</td>
            <td><span class="badge badge--high">High</span></td>
            <td>1 hour ago</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
