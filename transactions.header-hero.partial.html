<section
  class="transactions-hero"
  role="region"
  aria-label="Transactions header"
>
  <div class="transactions-hero__inner">
    <h1 class="transactions-hero__title">Transactions</h1>

    <div
      class="transactions-hero__controls"
      role="group"
      aria-label="Transaction filters"
    >
      <form class="transactions-hero__form" action="#" method="get">
        <label
          for="transactions-search"
          class="transactions-hero__visually-hidden"
          >Search</label
        >
        <input
          id="transactions-search"
          name="q"
          class="transactions-hero__search"
          type="search"
          placeholder="Search"
          aria-label="Search transactions"
        />

        <label
          for="transactions-type"
          class="transactions-hero__visually-hidden"
          >Transaction type</label
        >
        <select
          id="transactions-type"
          name="type"
          class="transactions-hero__select"
          aria-label="Transaction type"
        >
          <option value="">Transaction type</option>
          <option value="received">Received</option>
          <option value="sent">Sent</option>
          <option value="swap">Swap</option>
        </select>

        <label
          for="transactions-range"
          class="transactions-hero__visually-hidden"
          >Date range</label
        >
        <input
          id="transactions-range"
          name="range"
          class="transactions-hero__daterange"
          type="text"
          placeholder="DD.MM.YYYY - DD.MM.YYYY"
          aria-label="Date range"
        />
      </form>

      <button
        class="transactions-hero__btn transactions-hero__btn--download"
        type="button"
        aria-label="Download transactions"
      >
        Download
      </button>
    </div>
  </div>
</section>
