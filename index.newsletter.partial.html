<div class="newsletter">
  <div class="newsletter__content">
    <h2 class="newsletter__title">Stay Ahead of the Market</h2>
    <p class="newsletter__desc">
      Please keep me updated by email with the latest crypto news, research
      findings, reward programs, event updates, coin listings and more
      information from TrackFi.
    </p>
  </div>

  <form
    class="newsletter__form"
    action="#"
    method="post"
    novalidate
    aria-label="Subscribe to newsletter"
  >
    <label for="newsletter-email" class="newsletter__label visually-hidden"
      >Email address</label
    >
    <input
      id="newsletter-email"
      name="email"
      class="newsletter__input"
      type="email"
      inputmode="email"
      placeholder="Enter your email address"
      required
      aria-required="true"
    />
    <button type="submit" class="newsletter__btn newsletter__btn--primary">
      Subscribe
    </button>
  </form>
</div>
